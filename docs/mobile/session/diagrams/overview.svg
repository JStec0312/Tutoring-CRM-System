<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:826px;height:570px;background:#F8FAFC;" width="826px" height="570px" viewBox="0 0 826 570" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="826" height="570" fill="#F8FAFC" style="stroke:none;"/><g class="title" data-source-line="2"><text x="317.352" y="24.533" fill="#0F172A" font-size="14" textLength="184.796" font-weight="700">Session — who does what?</text></g><!--entity Screen--><g class="entity" data-qualified-name="Screen" id="ent0001" data-source-line="12"><rect x="485.5" y="50.609" width="136.71" height="55.219" fill="#DBEAFE" style="stroke:#CBD5E1;stroke-width:0.5;" rx="8" ry="8"/><text x="495.5" y="75.143" fill="#0F172A" font-size="14" textLength="58.345">SCREEN</text><text x="495.5" y="92.752" fill="#0F172A" font-size="14" textLength="116.71">Calls useSession()</text></g><!--entity Context--><g class="entity" data-qualified-name="Context" id="ent0002" data-source-line="13"><rect x="405.5" y="161.609" width="297.047" height="72.828" fill="#DBEAFE" style="stroke:#CBD5E1;stroke-width:0.5;" rx="8" ry="8"/><text x="415.5" y="186.143" fill="#0F172A" font-size="14" textLength="66.89">CONTEXT</text><text x="415.5" y="203.752" fill="#0F172A" font-size="14" textLength="277.047">SessionProvider supplies one session object</text><text x="415.5" y="221.361" fill="#0F172A" font-size="14" textLength="209.344">useSession subscribes and reads</text></g><!--entity Auth--><g class="entity" data-qualified-name="Auth" id="ent0003" data-source-line="14"><rect x="295" y="290.609" width="249.592" height="55.219" fill="#EDE9FE" style="stroke:#CBD5E1;stroke-width:0.5;" rx="8" ry="8"/><text x="305" y="315.143" fill="#0F172A" font-size="14" textLength="137.683">AUTH CONTROLLER</text><text x="305" y="332.752" fill="#0F172A" font-size="14" textLength="229.592">Coordinates login, refresh and logout</text></g><!--entity Store--><g class="entity" data-qualified-name="Store" id="ent0004" data-source-line="15"><rect x="530.5" y="401.609" width="260.844" height="72.828" fill="#DCFCE7" style="stroke:#CBD5E1;stroke-width:0.5;" rx="8" ry="8"/><text x="540.5" y="426.143" fill="#0F172A" font-size="14" textLength="114.358">SESSION STORE</text><text x="540.5" y="443.752" fill="#0F172A" font-size="14" textLength="183.634">Current user, status and error</text><text x="540.5" y="461.361" fill="#0F172A" font-size="14" textLength="240.844">Private access token + version counter</text></g><!--entity Storage--><g class="entity" data-qualified-name="Storage" id="ent0005" data-source-line="16"><rect x="6" y="401.609" width="247.582" height="72.828" fill="#FEF3C7" style="stroke:#CBD5E1;stroke-width:0.5;" rx="8" ry="8"/><text x="16" y="426.143" fill="#0F172A" font-size="14" textLength="161.027">CREDENTIAL STORAGE</text><text x="16" y="443.752" fill="#0F172A" font-size="14" textLength="125.282">Native: SecureStore</text><text x="16" y="461.361" fill="#0F172A" font-size="14" textLength="227.582">Web: HttpOnly cookie + local marker</text></g><!--entity Backend--><g class="entity" data-qualified-name="Backend" id="ent0006" data-source-line="17"><rect x="272" y="401.609" width="240.206" height="72.828" fill="#F1F5F9" style="stroke:#CBD5E1;stroke-width:0.5;" rx="8" ry="8"/><text x="282" y="426.143" fill="#0F172A" font-size="14" textLength="67.683">BACKEND</text><text x="282" y="443.752" fill="#0F172A" font-size="14" textLength="129.186">Validates credentials</text><text x="282" y="461.361" fill="#0F172A" font-size="14" textLength="220.206">Issues / revokes refresh credentials</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="25"><path d="M511.5,519.609 L511.5,546.313 A8,8 0 0 0 519.5,554.313 L802.02,554.313 A8,8 0 0 0 810.02,546.313 L810.02,521.609 L800.02,511.609 L665,5