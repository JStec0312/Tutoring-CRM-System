<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-labelledby="title desc"><title id="title">Paginated lesson read</title><desc id="desc">The controller checks the requested role. The handler counts owned lessons, fetches one ordered page and loads actual charges only for that page.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#333"/></marker></defs><rect width="920" height="440" fill="white"/><g fill="#eee" stroke="#333"><rect x="30" y="20" width="170" height="40"/><rect x="260" y="20" width="170" height="40"/><rect x="490" y="20" width="170" height="40"/><rect x="720" y="20" width="170" height="40"/></g><g font-family="sans-serif" font-size="14" fill="#222" text-anchor="middle"><text x="115" y="45">My lessons screen</text><text x="345" y="45">Controller</text><text x="575" y="45">Handler</text><text x="805" y="45">SQL Server</text></g><g stroke="#999" stroke-dasharray="5 5"><path d="M115 60V410M345 60V410M575 60V410M805 60V410"/></g><g stroke="#333" fill="none" marker-end="url(#arrow)"><path d="M115 110H345M345 165H575M575 215H805M805 255H575M575 300H805M805 345H575M575 395H115"/></g><g font-family="sans-serif" font-size="13" fill="#222" text-anchor="middle"><text x="230" y="100">GET page, view + JWT</text><text x="345" y="140">Validate requested role and subject</text><text x="460" y="155">Authenticated query</text><text x="690" y="205">Count owned, filtered lessons</text><text x="690" y="245">totalCount</text><text x="690" y="290">Ordered Skip/Take + page charges</text><text x="690" y="335">Current page records only</text><text x="345" y="385">items, effective page, pageSize, totalCount</text></g></svg>
