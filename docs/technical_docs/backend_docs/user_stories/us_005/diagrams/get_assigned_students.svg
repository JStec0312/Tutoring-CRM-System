<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Get Assigned Students flow</title>
  <desc id="desc">A tutor requests assigned students; the API handler loads active agreements and returns the distinct students with agreement details.</desc>
  <rect width="960" height="420" fill="white"/>
  <style>
    text { font-family: Arial, sans-serif; fill: #111827; }
    .actor { fill: #f8f9fb; stroke: #333333; stroke-width: 1.5; }
    .arrow { stroke: #333333; stroke-width: 1.5; marker-end: url(#arrow); }
    .label { font-size: 14px; }
    .title { font-size: 20px; font-weight: bold; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" class="title">Get Assigned Students - UML Sequence Diagram</text>
  <rect x="55" y="78" width="120" height="42" rx="4" class="actor"/>
  <rect x="280" y="78" width="210" height="42" rx="4" class="actor"/>
  <rect x="595" y="78" width="170" height="42" rx="4" class="actor"/>
  <rect x="825" y="78" width="80" height="42" rx="4" class="actor"/>
  <text x="115" y="105" text-anchor="middle" class="label">Tutor</text>
  <text x="385" y="105" text-anchor="middle" class="label">GetAssignedStudentsHandler</text>
  <text x="680" y="105" text-anchor="middle" class="label">TutoringDbContext</text>
  <text x="865" y="105" text-anchor="middle" class="label">Database</text>
  <line x1="115" y1="140" x2="115" y2="360" stroke="#64748b" stroke-dasharray="5 5"/>
  <line x1="385" y1="140" x2="385" y2="360" stroke="#64748b" stroke-dasharray="5 5"/>
  <line x1="680" y1="140" x2="680" y2="360" stroke="#64748b" stroke-dasharray="5 5"/>
  <line x1="865" y1="140" x2="865" y2="360" stroke="#64748b" stroke-dasharray="5 5"/>
  <line x1="125" y1="170" x2="375" y2="170" class="arrow"/>
  <text x="250" y="162" text-anchor="middle" class="label">GET /api/tutors/me/students</text>
  <line x1="395" y1="220" x2="670" y2="220" class="arrow"/>
  <text x="532" y="212" text-anchor="middle" class="label">Query active agreements</text>
  <line x1="690" y1="270" x2="855" y2="270" class="arrow"/>
  <text x="772" y="262" text-anchor="middle" class="label">SQL query</text>
  <line x1="855" y1="310" x2="395" y2="310" class="arrow"/>
  <text x="625" y="302" text-anchor="middle" class="label">Students and agreements</text>
  <line x1="375" y1="350" x2="125" y2="350" class="arrow"/>
  <text x="250" y="342" text-anchor="middle" class="label">200 OK</text>
</svg>
