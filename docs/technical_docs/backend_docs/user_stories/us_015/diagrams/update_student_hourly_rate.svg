<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="930" viewBox="0 0 1240 930" role="img" aria-labelledby="title description">
  <title id="title">US-015 - Update student hourly rate sequence</title>
  <desc id="description">Tutor request and JWT identity flow through the hourly rate controller, MediatR handler, database context, and tutoring agreement. The handler updates or clears the PLN rate and persists it, or returns 404 for an unavailable owned agreement.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#344054"/>
    </marker>
    <marker id="returnArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#667085"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #101828; }
      .title { font-size: 22px; font-weight: 700; }
      .actor { font-size: 13px; font-weight: 600; }
      .label { font-size: 12px; }
      .small { font-size: 11px; }
      .life { stroke: #98a2b3; stroke-width: 1.2; stroke-dasharray: 6 5; }
      .call { stroke: #344054; stroke-width: 1.5; marker-end: url(#arrow); }
      .return { stroke: #667085; stroke-width: 1.3; stroke-dasharray: 5 4; marker-end: url(#returnArrow); }
      .self { stroke: #344054; stroke-width: 1.3; fill: none; }
      .participant { fill: #f2f4f7; stroke: #667085; stroke-width: 1.2; rx: 4; }
      .frame { fill: #fff; stroke: #98a2b3; stroke-width: 1.2; }
      .tag { fill: #f2f4f7; stroke: #98a2b3; stroke-width: 1; }
      .error { fill: #fff5f5; }
    </style>
  </defs>

  <rect width="1240" height="930" fill="#ffffff"/>
  <text x="620" y="35" text-anchor="middle" class="title">US-015 - Update student hourly rate</text>

  <rect x="33" y="62" width="115" height="42" class="participant"/>
  <text x="90" y="88" text-anchor="middle" class="actor">Tutor</text>
  <rect x="178" y="62" width="215" height="42" class="participant"/>
  <text x="285" y="80" text-anchor="middle" class="actor">UpdateStudentHourlyRate</text>
  <text x="285" y="96" text-anchor="middle" class="actor">Controller</text>
  <rect x="435" y="62" width="120" height="42" class="participant"/>
  <text x="495" y="88" text-anchor="middle" class="actor">MediatR</text>
  <rect x="587" y="62" width="210" height="42" class="participant"/>
  <text x="692" y="80" text-anchor="middle" class="actor">UpdateStudentHourlyRate</text>
  <text x="692" y="96" text-anchor="middle" class="actor">Handler</text>
  <rect x="835" y="62" width="170" height="42" class="participant"/>
  <text x="920" y="88" text-anchor="middle" class="actor">TutoringDbContext</text>
  <rect x="1043" y="62" width="160" height="42" class="participant"/>
  <text x="1123" y="88" text-anchor="middle" class="actor">TutoringAgreement</text>

  <path d="M90 104 V895 M285 104 V895 M495 104 V895 M692 104 V895 M920 104 V895 M1123 104 V895" class="life"/>

  <line x1="90" y1="145" x2="285" y2="145" class="call"/>
  <text x="188" y="133" text-anchor="middle" class="label">PUT /api/tutors/students/{studentId}/hourly-rate</text>
  <text x="188" y="161" text-anchor="middle" class="small">JWT sub + hourlyRate</text>

  <path d="M285 183 h45 v28 h-45" class="self"/>
  <text x="338" y="195" class="small">Read sub → UserAccountId</text>
  <text x="338" y="209" class="small">RequestMetadata: IP, User-Agent, TraceId</text>

  <line x1="285" y1="243" x2="495" y2="243" class="call"/>
  <text x="390" y="231" text-anchor="middle" class="label">Send UpdateStudentHourlyRateCommand</text>
  <text x="390" y="259" text-anchor="middle" class="small">UserAccountId, StudentId, amount, metadata</text>
  <line x1="495" y1="284" x2="692" y2="284" class="call"/>
  <text x="594" y="272" text-anchor="middle" class="label">Handle(command, CancellationToken)</text>

  <line x1="692" y1="328" x2="920" y2="328" class="call"/>
  <text x="806" y="316" text-anchor="middle" class="label">Find Tutor by UserAccountId</text>
  <line x1="920" y1="356" x2="692" y2="356" class="return"/>
  <text x="806" y="348" text-anchor="middle" class="small">Tutor</text>

  <line x1="692" y1="402" x2="920" y2="402" class="call"/>
  <text x="806" y="390" text-anchor="middle" class="label">Find owned agreement: TutorId + StudentId</text>
  <text x="806" y="417" text-anchor="middle" class="small">Status != Ended</text>
  <line x1="920" y1="444" x2="692" y2="444" class="return"/>
  <text x="806" y="436" text-anchor="middle" class="small">Agreement or none</text>

  <rect x="570" y="470" width="636" height="354" class="frame"/>
  <path d="M570 470 H640 V494 H570 Z" class="tag"/>
  <text x="605" y="487" text-anchor="middle" class="small">alt</text>
  <rect x="570" y="494" width="636" height="82" class="error"/>
  <text x="585" y="515" class="small">[agreement not found / not owned]</text>
  <line x1="692" y1="540" x2="495" y2="540" class="return"/>
  <text x="594" y="532" text-anchor="middle" class="small">TutoringAgreementNotFoundException</text>
  <line x1="495" y1="559" x2="285" y2="559" class="return"/>
  <text x="390" y="552" text-anchor="middle" class="label">404 Not Found</text>
  <line x1="285" y1="559" x2="90" y2="559" class="return"/>
  <text x="188" y="552" text-anchor="middle" class="small">404 Not Found</text>

  <line x1="570" y1="576" x2="1206" y2="576" stroke="#98a2b3" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="585" y="598" class="small">[tutor-owned non-ended agreement found]</text>
  <path d="M692 618 h45 v28 h-45" class="self"/>
  <text x="745" y="629" class="small">Create HourlyRate(Money(amount, PLN))</text>
  <text x="745" y="643" class="small">or use null to clear</text>

  <line x1="692" y1="674" x2="1123" y2="674" class="call"/>
  <text x="908" y="662" text-anchor="middle" class="label">UpdateHourlyRate(hourlyRate or null)</text>
  <line x1="1123" y1="700" x2="692" y2="700" class="return"/>
  <text x="908" y="693" text-anchor="middle" class="small">Updated tracked agreement</text>

  <line x1="692" y1="735" x2="920" y2="735" class="call"/>
  <text x="806" y="723" text-anchor="middle" class="label">SaveChangesAsync(CancellationToken)</text>
  <line x1="920" y1="761" x2="692" y2="761" class="return"/>
  <text x="806" y="754" text-anchor="middle" class="small">Saved</text>

  <line x1="692" y1="795" x2="495" y2="795" class="return"/>
  <text x="594" y="787" text-anchor="middle" class="small">Completed</text>
  <line x1="495" y1="815" x2="285" y2="815" class="return"/>
  <text x="390" y="807" text-anchor="middle" class="small">Completed</text>
  <line x1="285" y1="857" x2="90" y2="857" class="return"/>
  <text x="188" y="849" text-anchor="middle" class="label">204 No Content</text>
</svg>
